# .github/workflows/anthropic-wif-test.yml
name: anthropic-wif-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    environment: ci-eval
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
            // Print the claims a federation rule matches on (not the signed token itself),
            // so the rule's subject/audience/issuer can be compared field by field.
            const c = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const pick = ['sub', 'aud', 'iss', 'repository', 'repository_id',
                          'repository_owner', 'repository_owner_id', 'environment', 'ref', 'event_name',
                          'workflow_ref', 'job_workflow_ref'];
            core.info(JSON.stringify(Object.fromEntries(pick.map(k => [k, c[k]])), null, 2));
      - name: Exchange for an Anthropic access token
        shell: bash  # implies -o pipefail, so a curl failure fails the step
        run: |
          curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01F6XK5gQPTdKSRT5Ji42sAT",
            "organization_id": "70f85dec-be63-4aa3-9b01-9d3d4674f689",
            "service_account_id": "svac_0127bsQ8KjLWgL3KSdsqmoNj",
            "workspace_id": "wrkspc_01JYkKyM85WMBvQthKLfLnCX"
          }
          JSON
