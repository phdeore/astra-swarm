name: Astra-Swarm Eval

# Runs on every PR with NO credentials: the eval replays Claude responses recorded in
# evals/cassettes/ (see record-eval.yml), so it costs nothing and is safe for PRs from
# forks. If a change alters prompts, tool output or graph flow, replay misses and the
# job fails with exit code 2 — re-record the cassettes and commit them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRA_ATTACK_CACHE_DIR: ${{ github.workspace }}/.cache/attack

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8"
      - name: Cache ATT&CK bundle
        uses: actions/cache@v4
        with:
          path: .cache/attack
          key: attack-${{ hashFiles('src/astra_swarm/attack_kb.py') }}
      - name: Unit tests
        run: pytest -q
      - name: Run evaluation (replay, no API calls)
        run: python scripts/run_eval.py --mode replay
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
          if-no-files-found: ignore
